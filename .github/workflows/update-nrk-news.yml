name: Update NRK news backup

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nrk-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update NRK backup JSON
        run: node javascript/update-nrk-news.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- data/nrk-news.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nrk-news.json
          git commit -m "Update NRK news backup"
          git push
