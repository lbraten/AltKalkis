<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltKalkis | Omdirigerer</title>
    <script>
        (function () {
            var redirectPath = window.location.pathname + window.location.search + window.location.hash;
            try {
                sessionStorage.setItem("altkalkis:redirect", redirectPath);
            } catch (error) {
                // Ingen handling ved utilgjengelig sessionStorage.
            }
            window.location.replace("./");
        })();
    </script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0a101e;
            color: #f1f3f8;
            font-family: "Open Sans", sans-serif;
        }

        main {
            text-align: center;
            padding: 1rem;
        }

        a {
            color: #ba91ff;
        }
    </style>
</head>
<body>
    <main>
        <p>Sender deg videre til AltKalkis...</p>
        <p>Hvis du ikke blir sendt automatisk, gå til <a href="./">startsiden</a>.</p>
    </main>
</body>
</html>
