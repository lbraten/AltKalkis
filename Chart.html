
<!-- HTML -->
<div style="max-width:800px;">
  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
    <input id="omLat" type="number" step="0.0001" placeholder="Latitude" style="flex:1; min-width:140px;" />
    <input id="omLon" type="number" step="0.0001" placeholder="Longitude" style="flex:1; min-width:140px;" />
    <button id="omFetchBtn" type="button">Hent siste 30 dager</button>
    <span id="omStatus" style="opacity:.75; font-size:14px;">Klar.</span>
  </div>
  <canvas id="myAreaChart" style="width:100%;max-width:800px;height:320px"></canvas>
</div>

<script type="module">
  import {
    Chart,
    LineController,
    LineElement,
    PointElement,
    LinearScale,
    TimeSeriesScale,
    Tooltip,
    Filler,
    CategoryScale,
    Legend,
  } from 'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.esm.js';

  // Registrer nødvendige komponenter
  Chart.register(
    LineController, LineElement, PointElement,
    LinearScale, CategoryScale, TimeSeriesScale,
    Tooltip, Filler, Legend
  );

  const lineColor = getComputedStyle(document.documentElement)
    .getPropertyValue('--bfc-attn')?.trim() || '#3b82f6';
  const gridColor = getComputedStyle(document.documentElement)
    .getPropertyValue('--bfc-base-dimmed')?.trim() || 'rgba(0,0,0,0.08)';
  const tickColor = getComputedStyle(document.documentElement)
    .getPropertyValue('--bfc-base-c-2')?.trim() || '#6b7280';

  const locale = 'nb-NO';
  const dayFormatter = new Intl.DateTimeFormat(locale, { day: '2-digit', month: '2-digit', year: 'numeric' });
  const numberFormatter = new Intl.NumberFormat(locale, { maximumFractionDigits: 1 });

  const latInput = document.getElementById('omLat');
  const lonInput = document.getElementById('omLon');
  const fetchBtn = document.getElementById('omFetchBtn');
  const statusEl = document.getElementById('omStatus');

  const DEFAULT_LAT = 59.9139; // Oslo
  const DEFAULT_LON = 10.7522;
  latInput.value = DEFAULT_LAT;
  lonInput.value = DEFAULT_LON;

  // Starter tomt – fylles via Open-Meteo
  let labels = [];
  let values = [];

  const ctx = document.getElementById('myAreaChart').getContext('2d');

  // Lag en vertikal gradient (topp -> bunn)
  const gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
  gradient.addColorStop(0, hexToRgba(lineColor, 0.8));
  gradient.addColorStop(1, hexToRgba(lineColor, 0));

  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: lineColor,
        borderWidth: 2,
        fill: true,
        backgroundColor: gradient,
        tension: 0.35, // mykere, moderne kurve
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHitRadius: 10,
        borderCapStyle: 'round',
        borderJoinStyle: 'round',
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { left: 10 } },
      interaction: { mode: 'index', intersect: false },
      elements: {
        line: { borderWidth: 2 },
        point: { radius: 0, hoverRadius: 4, hitRadius: 10 },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(9, 24, 39, 0.92)',
          titleColor: '#e5e7eb',
          bodyColor: '#f3f4f6',
          borderColor: 'rgba(59, 130, 246, 0.35)',
          borderWidth: 1,
          padding: 12,
          cornerRadius: 10,
          displayColors: false,
          callbacks: {
            label: (ctx) => `Temperatur: ${numberFormatter.format(ctx.parsed.y)}°C`,
            title: (items) => items.map(i => labels[i.dataIndex]),
          },
        },
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { display: false },
        },
        y: {
          grid: {
            color: gridColor,
            borderDash: [5, 5],
            drawTicks: false,
          },
          ticks: {
            color: tickColor,
            callback: (v) => numberFormatter.format(v),
            font: { size: 14 },
            padding: 8,
          },
          border: { display: false },
        },
      },
    },
  });

  const setStatus = (msg) => (statusEl.textContent = msg);

  function formatDateYmd(d) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function getLastDaysRange(days = 30) {
    const end = new Date();
    const start = new Date();
    start.setDate(end.getDate() - (days - 1));
    return { start, end };
  }

  async function fetchLast30Days(lat, lon) {
    const { start, end } = getLastDaysRange(30);
    const startDate = formatDateYmd(start);
    const endDate = formatDateYmd(end);

    const url =
      'https://archive-api.open-meteo.com/v1/archive' +
      `?latitude=${encodeURIComponent(lat)}` +
      `&longitude=${encodeURIComponent(lon)}` +
      `&start_date=${startDate}` +
      `&end_date=${endDate}` +
      `&daily=temperature_2m_mean` +
      `&timezone=Europe%2FOslo`;

    setStatus('Henter værdata…');
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Vær-API feil: ${res.status} ${res.statusText}`);
    const data = await res.json();

    const days = data?.daily?.time || [];
    const temps = data?.daily?.temperature_2m_mean || [];

    labels = days.map((d) => dayFormatter.format(new Date(d)));
    values = temps.map((t) => (Number.isFinite(t) ? t : null));

    chart.data.labels = labels;
    chart.data.datasets[0].data = values;
    chart.update();

    setStatus(`Viser ${labels.length} dager (${startDate}–${endDate}).`);
  }

  fetchBtn.addEventListener('click', async () => {
    const lat = Number(latInput.value);
    const lon = Number(lonInput.value);

    if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
      setStatus('Skriv inn gyldige koordinater.');
      return;
    }

    try {
      await fetchLast30Days(lat, lon);
    } catch (err) {
      console.error(err);
      setStatus(`Feil: ${err.message}`);
    }
  });

  // Auto-hent ved innlasting
  fetchLast30Days(DEFAULT_LAT, DEFAULT_LON).catch((err) => {
    console.error(err);
    setStatus(`Feil: ${err.message}`);
  });

  // Hjelpefunksjon for RGBA
  function hexToRgba(hex, alpha = 1) {
    const c = hex.replace('#', '');
    const bigint = parseInt(c.length === 3 ? c.split('').map(x => x + x).join('') : c, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  // Rebuild gradient on resize to keep nice falloff
  new ResizeObserver(() => {
    const { height } = ctx.canvas.getBoundingClientRect();
    const g = ctx.createLinearGradient(0, 0, 0, height);
    g.addColorStop(0, hexToRgba(lineColor, 0.8));
    g.addColorStop(1, hexToRgba(lineColor, 0));
    chart.data.datasets[0].backgroundColor = g;
    chart.update('none');
  }).observe(ctx.canvas);
</script>
